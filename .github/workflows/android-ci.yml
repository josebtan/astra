name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (core + camera + raw + calibration + stacking + registration + quality)
        run: ./gradlew :core:testDebugUnitTest :camera:testDebugUnitTest :raw:testDebugUnitTest :calibration:testDebugUnitTest :stacking:testDebugUnitTest :registration:testDebugUnitTest :quality:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            core/build/reports/tests/testDebugUnitTest
            camera/build/reports/tests/testDebugUnitTest
            raw/build/reports/tests/testDebugUnitTest
            calibration/build/reports/tests/testDebugUnitTest
            stacking/build/reports/tests/testDebugUnitTest
            registration/build/reports/tests/testDebugUnitTest
            quality/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
